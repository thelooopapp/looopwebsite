<!doctype html>
<html><head><meta charset="utf-8">
<style>
/* Weather Grid (lib/Widgets/weatherGrid.dart + design/forecast_tile.dart) at
   iOS points, 4 people = squares. Real Open-Meteo forecast pulled 2026-10-21. */
*{box-sizing:border-box}
html,body{margin:0;background:transparent}
body{font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.stage{padding:36px 44px 64px;width:fit-content}
.device{position:relative;width:417px;height:876px;padding:12px;border-radius:63px;background:#0B0D10;
  box-shadow:0 24px 50px rgba(5,30,66,.28),inset 0 0 0 2px #4A505A,inset 0 0 0 4px #15181C}
.btn{position:absolute;width:5px;border-radius:3px 0 0 3px;background:#23272E;left:-4px}
.btn.r{left:auto;right:-4px;border-radius:0 3px 3px 0}
.screen{width:393px;height:852px;border-radius:51px;overflow:hidden;background:#F2F3F6;color:#1E2126;display:flex;flex-direction:column}
.top{background:linear-gradient(170deg,#2A8AE0 0%,#1B73C6 60%,#0F4F92 100%);color:#fff;flex:none}
.top h1{margin:0;padding:10px 20px 18px;font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-.4px}
.body{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:20px}
.status{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:54px;padding:0 26px 0 40px}
.status .t{font-size:17px;font-weight:600;letter-spacing:-.2px}
.status svg{fill:currentColor}
.island{width:124px;height:36px;border-radius:18px;background:#000;margin-top:2px}
.status .ic{display:flex;justify-content:flex-end;gap:6px;align-items:center}
.wrap{padding:12px 16px 0}
.line{display:flex;justify-content:space-between;padding:0 12px}
.lead{width:70px;flex:none}
.col{width:58px;flex:none;position:relative}
.head .col .back{position:absolute;left:0;right:0;top:-12px;bottom:-16px;border-radius:16px 16px 0 0;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.06);
  -webkit-mask-image:linear-gradient(#000 0,#000 60%,transparent 90%);mask-image:linear-gradient(#000 0,#000 60%,transparent 90%)}
.ph{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:0}
.ph img{width:55px;height:55px;border-radius:50%;object-fit:cover;display:block}
.ph b{margin-top:2px;font-size:13px;line-height:1.15;font-weight:700;color:rgba(0,0,0,.87)}
.ph .c{margin-top:4px;font-size:9.9px;line-height:1.15;font-weight:600;color:#757575;white-space:nowrap}
.ph .s{font-size:7.2px;line-height:1.15;font-weight:600;color:#757575;white-space:nowrap}
.rows{margin-top:16px}
.row{height:70px;margin-bottom:8px;background:#fff;border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);
  display:flex;align-items:center;justify-content:space-between;padding:6px 12px}
.row.today{box-shadow:inset 0 0 0 3px rgba(27,115,198,.3),0 1px 3px rgba(0,0,0,.06)}
.day b{display:block;font-size:14px;font-weight:700;color:rgba(0,0,0,.87);line-height:1.2}
.today .day b{color:#1B73C6}
.day span{display:block;font-size:11px;font-weight:700;color:rgba(0,0,0,.87);line-height:1.25}
.tile{width:58px;height:58px;border-radius:8px;background-size:cover;background-position:center;
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:#000}
.tile.dark{color:#fff;text-shadow:0 0 6px rgba(0,0,0,.6)}
.tile.dark svg{filter:drop-shadow(0 0 3px rgba(0,0,0,.6))}
.back-row{display:flex;gap:8px;margin-top:8px}
.back-row>div{height:70px;border-radius:16px;background:#E8EEFB;display:flex;align-items:center;color:#1B73C6}
.back-row .b{width:70px;justify-content:center}
.back-row .x{flex:1;justify-content:space-evenly}
.back-row svg{width:22px;height:22px}
.tile svg{width:17px;height:17px;margin-bottom:2px}
.tile .h{font-size:15px;font-weight:700;line-height:1}
.tile .l{margin-top:2px;font-size:11px;font-weight:600;line-height:1}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- CupertinoIcons-style outlines, as weatherIconFor picks them -->
    <symbol id="sun" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.2v2.6M12 19.2v2.6M2.2 12h2.6M19.2 12h2.6M5.07 5.07l1.84 1.84M17.09 17.09l1.84 1.84M5.07 18.93l1.84-1.84M17.09 6.91l1.84-1.84"/></g></symbol>
    <symbol id="cloud" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" d="M7 18.5h10.6a4 4 0 0 0 .5-7.97A5.6 5.6 0 0 0 7.3 9.3 4.6 4.6 0 0 0 7 18.5z"/></symbol>
    <symbol id="rain" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15.5h10.6a4 4 0 0 0 .5-7.97A5.6 5.6 0 0 0 7.3 6.3 4.6 4.6 0 0 0 7 15.5z"/><path d="M8.6 18l-1 2.6M12.6 18l-1 2.6M16.6 18l-1 2.6"/></g></symbol>
    <symbol id="cloudsun" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.2 7.6a3.4 3.4 0 0 1 5.9-1.5M10.6 2.2v1.6M4.6 8.2h1.6M5.9 3.5l1.1 1.1M15.3 3.5l-1.1 1.1"/><path d="M8 20h9.8a3.7 3.7 0 0 0 .4-7.38A5.2 5.2 0 0 0 8.3 11.5 4.25 4.25 0 0 0 8 20z"/></g></symbol>
  </defs>
</svg>
<div class="stage">
<div class="device">
  <div class="btn" style="top:150px;height:30px"></div>
  <div class="btn" style="top:205px;height:60px"></div>
  <div class="btn" style="top:278px;height:60px"></div>
  <div class="btn r" style="top:225px;height:95px"></div>
  <div class="screen">
    <div class="top"><div class="status">
      <div class="t">9:41</div><div class="island"></div>
      <div class="ic">
        <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="16" height="12" viewBox="0 0 256 192"><path d="M244 60.8L140 186.2a16 16 0 0 1-24.6 0L11.6 60.8A16 16 0 0 1 14.3 38 186.7 186.7 0 0 1 128 0a186.7 186.7 0 0 1 113.7 38 16 16 0 0 1 2.3 22.8z"/></svg>
        <svg width="26" height="13" viewBox="0 0 26 13"><rect x=".5" y=".5" width="22" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="19" height="9" rx="2"/><path d="M24 4.5v4a2 2 0 0 0 0-4z" opacity=".4"/></svg>
      </div>
    </div>
    <h1>My Family's Weather</h1></div>
    <div class="body"><div class="wrap" id="grid"></div></div>
  </div>
</div>
</div>
<script>
// dark = rain/storm day photos (weather_sky.dart _darkDaySkies)
const T={clear:['clear_day.jpg','sun',0],partly:['partly_day.jpg','cloudsun',0],overcast:['overcast_day.jpg','cloud',0],
  drizzle:['drizzle_day.jpg','rain',0],rain:['rain_day.jpg','rain',1]};
const people=[
  {n:'Tony',img:'tony.jpg',c:'San Diego',s:'California',d:[['rain',77,63],['drizzle',67,59],['drizzle',71,58],['overcast',73,66],['overcast',77,67]]},
  {n:'Bud', img:'bro.jpg', c:'Austin',   s:'Texas',     d:[['clear',84,51],['overcast',85,60],['overcast',84,57],['overcast',86,66],['overcast',81,67]]},
  {n:'Mom', img:'mom.jpg', c:'Chicago',  s:'Illinois',  d:[['overcast',69,42],['clear',64,44],['overcast',69,47],['overcast',70,57],['overcast',71,59]]},
  {n:'Sis', img:'sis.jpg', c:'Madrid',   s:'Spain',     d:[['overcast',65,46],['overcast',65,44],['overcast',67,51],['overcast',65,41],['partly',68,43]]},
];
const days=[['Today','Oct 21'],['Thu','Oct 22'],['Fri','Oct 23'],['Sat','Oct 24'],['Sun','Oct 25']];
let h='<div class="line head"><div class="lead"></div>'+people.map(p=>
  `<div class="col"><div class="back"></div><div class="ph"><img src="${p.img}"><b>${p.n}</b><span class="c">${p.c}</span><span class="s">${p.s}</span></div></div>`).join('')+'</div><div class="rows">';
days.forEach((d,i)=>{
  h+=`<div class="row${i?'':' today'}"><div class="lead day"><b>${d[0]}</b><span>${d[1]}</span></div>`+people.map(p=>{
    const [k,hi,lo]=p.d[i],[img,ic,dk]=T[k];
    return `<div class="tile${dk?' dark':''}" style="background-image:url(${img})"><svg><use href="#${ic}"/></svg><span class="h">${hi}°</span><span class="l">${lo}°</span></div>`;
  }).join('')+'</div>';
});
h+='</div><div class="back-row"><div class="b"><svg viewBox="0 0 24 24"><path d="M15 4.5 7.5 12l7.5 7.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="x">'+
 '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 9H6.5a1.5 1.5 0 0 0-1.5 1.5v9A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5v-9A1.5 1.5 0 0 0 17.5 9h-2M12 2.5V15M8.5 6 12 2.5 15.5 6"/></svg>'+
 '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M12 7.5v9M8 12.5l4 4 4-4"/></svg>'+
 '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9.2 7.6a3.4 3.4 0 0 1 5.9-1.5M10.6 2.2v1.6M4.6 8.2h1.6M5.9 3.5l1.1 1.1"/><path d="M8 17h9.8a3.7 3.7 0 0 0 .4-7.38A5.2 5.2 0 0 0 8.3 8.5 4.25 4.25 0 0 0 8 17z"/><path d="M10 19.5l-.8 2M14 19.5l-.8 2"/></svg>'+
 '</div></div>';
document.getElementById('grid').innerHTML=h;
</script>
</body></html>
